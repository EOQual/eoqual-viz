# Documentation de poetry: https://python-poetry.org/docs/pyproject/

[tool.poetry]
name = "eoqual-viz"
version = "0.1.0"
description = "Generic Plotly visualisation helpers shared across EOQual modules"
authors = ["Olivier Amram <olivier.amram@free.fr>"]
maintainers = [
    "Olivier Amram <olivier.amram@free.fr>"
]
repository = "https://github.com/EOQual/eoqual-viz.git"
readme = "README.md"
license = "MIT"
keywords = ["plotly", "visualisation", "heatmap", "profile", "earth-observation"]
packages = [{include = "eoqual/viz", from = "src"}]
exclude = [
    "**/__pycache__",
    "**/.DS_Store",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
# Règle du paquet : numpy et plotly seulement (voir README, « Règles »).
numpy = "*"
plotly = "*"

[tool.poetry.group.dev.dependencies]
poetry = "^2.1.1"
ipython = "^8.8.0"
black = "^23.3.0"
coverage = "^6.5.0"
pylint = "*"
pytest = "<9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
